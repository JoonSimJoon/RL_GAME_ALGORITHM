env: frozenlake
algo: q_learning
seed: 42
device: cpu
train_episodes: 60000
eval_episodes: 3000
eval_interval: 3000
plot_window: 150

env_kwargs:
  is_slippery: true
  desc:
    - "SFHFF"
    - "FHFHF"
    - "FFFHF"
    - "HFFFF"
    - "FFFHF"
    - "HHFFG"

algo_params:
  alpha: 0.15
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay: 0.9

network:
  hidden_sizes: []
