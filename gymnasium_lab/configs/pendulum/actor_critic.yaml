env: pendulum
algo: actor_critic
seed: 42
device: cpu
train_episodes: 300
eval_episodes: 10
eval_interval: 20
plot_window: 20

algo_params:
  gamma: 0.99
  lr: 0.0007
  actor_lr: 0.0007
  critic_lr: 0.001
  init_log_std: -0.7
  entropy_coef: 0.0005
  value_coef: 0.5

network:
  hidden_sizes: [128, 128]
